<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Helvetica, Arial, sans-serif">
  <title>Client Segmentation Service: system overview and segment retrieval</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9673a6"/>
    </marker>
    <marker id="arry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8962e"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d8a42"/>
    </marker>
    <style>
      .t  { font-size: 13px; font-weight: bold; fill: #1f2937; }
      .d  { font-size: 11px; font-style: italic; fill: #1f2937; }
      .b  { font-size: 10.5px; fill: #374151; }
      .s  { font-size: 11px; fill: #374151; }
      .m  { font-size: 11px; fill: #374151; font-family: "Courier New", monospace; }
      .lb { font-size: 10px; fill: #4b5563; }
      .h  { font-size: 14px; font-weight: bold; fill: #1f2937; }
    </style>
  </defs>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="30" y="34" class="h" font-size="18">Client Segmentation Service: system overview and segment retrieval</text>

  <!-- Consumers -->
  <text x="30" y="72" class="h">External Vanguard microservices</text>
  <rect x="30" y="88"  width="200" height="42" rx="8" fill="#f5f5f5" stroke="#666"/>
  <text x="130" y="114" class="t" text-anchor="middle">Web / mobile backend</text>
  <rect x="30" y="140" width="200" height="42" rx="8" fill="#f5f5f5" stroke="#666"/>
  <text x="130" y="166" class="t" text-anchor="middle">Contact-center service</text>
  <rect x="30" y="192" width="200" height="42" rx="8" fill="#f5f5f5" stroke="#666"/>
  <text x="130" y="218" class="t" text-anchor="middle">Marketing / offers service</text>
  <rect x="30" y="244" width="200" height="42" rx="8" fill="#ffffff" stroke="#999" stroke-dasharray="5 4"/>
  <text x="130" y="270" class="s" text-anchor="middle">Demo dashboard (FR-18)</text>
  <rect x="30" y="296" width="200" height="42" rx="8" fill="#ffffff" stroke="#999" stroke-dasharray="5 4"/>
  <text x="130" y="322" class="s" text-anchor="middle">Intent service (future extension)</text>
  <text x="30" y="362" class="lb">HTTP/JSON · X-Request-ID · X-Consumer-Id</text>
  <text x="30" y="377" class="lb">clients generated from /openapi.json</text>

  <!-- FastAPI container -->
  <rect x="270" y="60" width="780" height="600" rx="12" fill="#eef4fb" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="288" y="84" class="h">Segmentation Service (FastAPI · Docker)</text>

  <rect x="290" y="100" width="740" height="60" rx="8" fill="#fff" stroke="#6c8ebf"/>
  <text x="660" y="123" class="t" text-anchor="middle">① API layer: routers · Pydantic schemas · middleware</text>
  <text x="660" y="143" class="m" text-anchor="middle">GET /v1/clients/{clientId}/segments · POST /v1/segments:batch · /v1/rulesets</text>

  <rect x="290" y="180" width="740" height="56" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="660" y="202" class="t" text-anchor="middle">② SegmentationService (orchestrator)</text>
  <text x="660" y="221" class="s" text-anchor="middle">families requested + dependencies → facts needed → data types to load → derive → evaluate → respond</text>

  <!-- Rule Engine -->
  <rect x="290" y="260" width="235" height="200" rx="8" fill="#fff2cc" stroke="#d6b656"/>
  <text x="407" y="282" class="t" text-anchor="middle">⑤ Rule Engine</text>
  <text x="302" y="302" class="d">Pure function that turns facts into</text>
  <text x="302" y="316" class="d">segments using the active rule set.</text>
  <text x="302" y="340" class="b">• No I/O, DB, or clock reads: deterministic</text>
  <text x="302" y="358" class="b">• 4 evaluator kinds: bands, value map,</text>
  <text x="312" y="372" class="b">range, predicates</text>
  <text x="302" y="390" class="b">• Exclusive families first, then</text>
  <text x="312" y="404" class="b">OPPORTUNITY (dependency order)</text>
  <text x="302" y="422" class="b">• Returns a FamilyResult + trace</text>
  <text x="312" y="436" class="b">per family</text>

  <!-- Fact Deriver -->
  <rect x="542" y="260" width="235" height="200" rx="8" fill="#fff" stroke="#6c8ebf"/>
  <text x="659" y="282" class="t" text-anchor="middle">④ Fact Deriver</text>
  <text x="554" y="302" class="d">Turns loaded documents into named</text>
  <text x="554" y="316" class="d">facts as of the request's asOfDate.</text>
  <text x="554" y="340" class="b">• FACTS registry maps each fact to</text>
  <text x="564" y="354" class="b">its data type</text>
  <text x="554" y="372" class="b">• age · qualifyingBalance (Decimal)</text>
  <text x="564" y="386" class="b">heldOpenAccountTypes · daysSinceLogin</text>
  <text x="554" y="404" class="b">• Applies accountFilter (OPEN, primary)</text>
  <text x="554" y="422" class="b">• Emits DataQuality notes</text>
  <text x="564" y="436" class="b">(missing data, conflicts)</text>

  <!-- Repositories -->
  <rect x="795" y="260" width="235" height="200" rx="8" fill="#fff" stroke="#6c8ebf"/>
  <text x="912" y="282" class="t" text-anchor="middle">③ Repositories</text>
  <text x="807" y="302" class="d">One per data type; each fetches a</text>
  <text x="807" y="316" class="d">client's documents from MongoDB.</text>
  <text x="807" y="340" class="b">• Profile · Accounts · Engagement</text>
  <text x="817" y="354" class="b">· Advice</text>
  <text x="807" y="372" class="b">• Loads only the data types the</text>
  <text x="817" y="386" class="b">request needs</text>
  <text x="807" y="404" class="b">• Indexed find() in one snapshot</text>
  <text x="817" y="418" class="b">session per request</text>
  <text x="807" y="436" class="b">• Fetch only: no business rules</text>

  <path d="M407,236 V258" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M659,236 V258" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M912,236 V258" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Rule-Set Registry -->
  <rect x="290" y="482" width="235" height="160" rx="8" fill="#fff2cc" stroke="#d6b656"/>
  <text x="407" y="504" class="t" text-anchor="middle">Rule-Set Registry</text>
  <text x="302" y="524" class="d">Loads, validates, and caches rule-set</text>
  <text x="302" y="538" class="d">documents stored in MongoDB.</text>
  <text x="302" y="560" class="b">• Reads rulesets + settings collections</text>
  <text x="302" y="578" class="b">• Published versions cached (immutable)</text>
  <text x="302" y="596" class="b">• Active pointer refreshed every 30 s</text>
  <text x="302" y="614" class="b">• Validates drafts; serves draft →</text>
  <text x="312" y="628" class="b">publish → activate</text>
  <path d="M407,482 V462" stroke="#b8962e" stroke-width="1.6" marker-end="url(#arry)"/>
  <text x="414" y="475" class="lb">rule set</text>

  <text x="795" y="490" class="lb">snapshot session: one consistent</text>
  <text x="795" y="504" class="lb">point-in-time read per request</text>

  <!-- MongoDB -->
  <path d="M1100,200 a135,22 0 0,0 270,0 a135,22 0 0,0 -270,0 v300 a135,22 0 0,0 270,0 v-300" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="1235" y="250" class="h" text-anchor="middle">MongoDB 7</text>
  <text x="1235" y="268" class="lb" text-anchor="middle">single-node replica set · one collection per data type</text>
  <text x="1118" y="300" class="t">Profile</text>      <text x="1214" y="300" class="m">clients</text>
  <text x="1118" y="324" class="t">Accounts</text>     <text x="1214" y="324" class="m">accounts</text>
  <text x="1214" y="339" class="lb">ownerClientIds[] · holdings[]</text>
  <text x="1118" y="363" class="t">Engagement</text>   <text x="1214" y="363" class="m">engagement</text>
  <text x="1118" y="387" class="t">Advice</text>       <text x="1214" y="387" class="m">advice</text>
  <line x1="1118" y1="402" x2="1352" y2="402" stroke="#9673a6" stroke-dasharray="3 3"/>
  <text x="1118" y="424" class="t">Rules</text>        <text x="1214" y="424" class="m">rulesets</text>
  <text x="1214" y="440" class="m">settings</text>
  <text x="1118" y="466" class="t">Ingestion</text>    <text x="1214" y="466" class="m">ingestion_runs</text>
  <text x="1214" y="482" class="m">ingestion_issues</text>

  <!-- Repos <-> Mongo -->
  <path d="M1030,340 H1098" stroke="#9673a6" stroke-width="1.6" marker-start="url(#arrp)" marker-end="url(#arrp)"/>
  <text x="1036" y="332" class="lb">find()</text>

  <!-- Registry <-> Mongo -->
  <path d="M525,600 H1075 V432 H1098" fill="none" stroke="#b8962e" stroke-width="1.6" marker-start="url(#arry)" marker-end="url(#arry)"/>
  <text x="560" y="592" class="lb">read rulesets + settings · write drafts / publish / activate</text>

  <!-- IngestionService -->
  <rect x="1100" y="580" width="270" height="150" rx="8" fill="#fff" stroke="#9673a6"/>
  <text x="1235" y="602" class="t" text-anchor="middle">IngestionService</text>
  <text x="1112" y="622" class="d">Loads and refreshes client data and</text>
  <text x="1112" y="636" class="d">seed rule sets in MongoDB.</text>
  <text x="1112" y="658" class="b">• Validates each data type (Pydantic)</text>
  <text x="1112" y="676" class="b">• Decimal128 money · rejects bad DOBs</text>
  <text x="1112" y="694" class="b">• Quarantines orphan records</text>
  <text x="1112" y="712" class="b">• Staging collections → atomic swap</text>
  <rect x="1100" y="760" width="270" height="44" rx="8" fill="#f5f5f5" stroke="#999"/>
  <text x="1235" y="787" class="m" text-anchor="middle">data/*.json · rulesets/*.json</text>
  <path d="M1235,760 V732" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M1235,580 V524" stroke="#9673a6" stroke-width="1.6" marker-end="url(#arrp)"/>
  <text x="1242" y="556" class="lb">updates MongoDB</text>

  <!-- Response contract -->
  <path d="M660,660 V688" stroke="#4d8a42" stroke-width="2" marker-end="url(#arrg)"/>
  <text x="668" y="680" class="lb" fill="#4d8a42">⑥ 200 SegmentResponse → back to the calling microservice</text>

  <rect x="270" y="690" width="780" height="180" rx="10" fill="#eaf5e7" stroke="#82b366"/>
  <text x="288" y="714" class="t">Uniform response: every family returns the same FamilyResult</text>
  <text x="288" y="738" class="m">"segments": {</text>
  <text x="288" y="754" class="m">  "SERVICE_TIER": {"status":"ASSIGNED","values":["FLAGSHIP"]},</text>
  <text x="288" y="770" class="m">  "LIFE_STAGE":   {"status":"OTHER","values":[],"reason":"MISSING_DOB"},</text>
  <text x="288" y="786" class="m">  "ENGAGEMENT":   {"status":"NONE","values":[]},</text>
  <text x="288" y="802" class="m">  "OPPORTUNITY":  {"status":"ASSIGNED","values":["ROLLOVER_CANDIDATE"]}</text>
  <text x="288" y="818" class="m">}, "signals": {...}, "dataQuality": [...], "ruleSetVersion": "1.0.0"</text>
  <text x="288" y="848" class="s">Consumers check membership the same way for every family:  "FLAGSHIP" in segments.SERVICE_TIER.values</text>

  <!-- Consumer arrows (drawn last so heads sit above boxes) -->
  <path d="M230,109 C268,109 268,118 288,118" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M230,161 C268,161 268,124 288,124" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M230,213 C268,213 268,130 288,130" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M230,265 C268,265 268,136 288,136" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <path d="M230,317 C268,317 268,142 288,142" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
</svg>
