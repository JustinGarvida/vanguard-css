<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Helvetica, Arial, sans-serif">
  <title>Client Segmentation Service: FastAPI build</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d8a42"/>
    </marker>
    <style>
      .t  { font-size: 13px; font-weight: bold; fill: #1f2937; }
      .s  { font-size: 11px; fill: #374151; }
      .m  { font-size: 11px; fill: #374151; font-family: "Courier New", monospace; }
      .lb { font-size: 10px; fill: #4b5563; }
      .h  { font-size: 14px; font-weight: bold; fill: #1f2937; }
    </style>
  </defs>
  <rect width="1200" height="860" fill="#ffffff"/>
  <text x="30" y="40" class="h" font-size="18">Client Segmentation Service: FastAPI build (services/segmentation)</text>

  <!-- Consumers -->
  <rect x="30" y="100" width="160" height="110" rx="8" fill="#f5f5f5" stroke="#666"/>
  <text x="110" y="130" class="t" text-anchor="middle">External Vanguard</text>
  <text x="110" y="147" class="t" text-anchor="middle">microservices</text>
  <text x="110" y="170" class="lb" text-anchor="middle">X-Request-ID</text>
  <text x="110" y="184" class="lb" text-anchor="middle">X-Consumer-Id</text>
  <text x="194" y="119" class="lb">request</text>
  <text x="194" y="164" class="lb" fill="#4d8a42">JSON</text>

  <!-- rulesets -->
  <path d="M30,470 h180 v62 q-22.5,-12 -45,0 t-45,0 t-45,0 t-45,0 z" fill="#fff2cc" stroke="#d6b656"/>
  <text x="120" y="492" class="t" text-anchor="middle">rulesets/*.json</text>
  <text x="120" y="510" class="s" text-anchor="middle">git seeds → MongoDB</text>
  <text x="120" y="524" class="s" text-anchor="middle">validated on load + write</text>

  <!-- FastAPI container -->
  <rect x="240" y="70" width="640" height="660" rx="12" fill="#eef4fb" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="258" y="94" class="h">FastAPI app: app/main.py create_app()  ·  uvicorn  ·  Docker</text>

  <!-- middleware -->
  <rect x="260" y="108" width="600" height="52" rx="8" fill="#fff" stroke="#6c8ebf"/>
  <text x="560" y="130" class="t" text-anchor="middle">api/middleware.py</text>
  <text x="560" y="148" class="s" text-anchor="middle">request ID propagation · structured JSON access logs · timing · consumer ID</text>

  <!-- routers -->
  <rect x="260" y="178" width="141" height="80" rx="8" fill="#fff" stroke="#6c8ebf"/>
  <text x="330" y="198" class="t" text-anchor="middle">segments.py</text>
  <text x="330" y="216" class="m" text-anchor="middle" font-size="9.5">GET /v1/clients/</text>
  <text x="330" y="229" class="m" text-anchor="middle" font-size="9.5">{id}/segments</text>
  <text x="330" y="245" class="m" text-anchor="middle" font-size="9.5">POST segments:batch</text>

  <rect x="413" y="178" width="141" height="80" rx="8" fill="#fff" stroke="#6c8ebf"/>
  <text x="483" y="198" class="t" text-anchor="middle">rulesets.py</text>
  <text x="483" y="222" class="m" text-anchor="middle" font-size="9.5">CRUD drafts</text>
  <text x="483" y="237" class="m" text-anchor="middle" font-size="9.5">:publish · /active</text>

  <rect x="566" y="178" width="141" height="80" rx="8" fill="#fff" stroke="#999" stroke-dasharray="5 4"/>
  <text x="636" y="198" class="t" text-anchor="middle">built-in docs</text>
  <text x="636" y="222" class="m" text-anchor="middle" font-size="9.5">GET /docs</text>
  <text x="636" y="237" class="m" text-anchor="middle" font-size="9.5">GET /openapi.json</text>

  <rect x="719" y="178" width="141" height="80" rx="8" fill="#fff" stroke="#6c8ebf"/>
  <text x="789" y="198" class="t" text-anchor="middle">health.py</text>
  <text x="789" y="222" class="m" text-anchor="middle" font-size="9.5">GET /health</text>
  <text x="789" y="237" class="m" text-anchor="middle" font-size="9.5">GET /ready</text>

  <!-- deps -->
  <rect x="260" y="276" width="600" height="52" rx="8" fill="#fff" stroke="#6c8ebf"/>
  <text x="560" y="298" class="t" text-anchor="middle">api/deps.py: Depends() providers (swappable via dependency_overrides in tests)</text>
  <text x="560" y="316" class="m" text-anchor="middle">get_settings · get_snapshot_session · get_segmentation_service</text>
  <path d="M330,258 V274" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- service -->
  <rect x="260" y="346" width="600" height="62" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="560" y="370" class="t" text-anchor="middle">services/segmentation.py: SegmentationService.segment()</text>
  <text x="560" y="390" class="s" text-anchor="middle">rule set → families + deps → required data types → load → derive facts → evaluate → build response</text>
  <path d="M330,328 V344" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- bottom row -->
  <rect x="260" y="430" width="190" height="150" rx="8" fill="#fff2cc" stroke="#d6b656"/>
  <text x="355" y="452" class="t" text-anchor="middle">engine/ (pure)</text>
  <text x="355" y="472" class="m" text-anchor="middle">ruleset.py</text>
  <text x="355" y="486" class="lb" text-anchor="middle">Pydantic models, "kind" union</text>
  <text x="355" y="504" class="m" text-anchor="middle">evaluators.py</text>
  <text x="355" y="518" class="lb" text-anchor="middle">BANDS · MAP · RANGE · PREDICATES</text>
  <text x="355" y="536" class="m" text-anchor="middle">engine.py</text>
  <text x="355" y="550" class="lb" text-anchor="middle">evaluate() → FamilyResult</text>
  <text x="355" y="568" class="lb" text-anchor="middle">registry.py · no DB/clock imports</text>

  <rect x="465" y="430" width="190" height="150" rx="8" fill="#fff" stroke="#6c8ebf"/>
  <text x="560" y="452" class="t" text-anchor="middle">domain/</text>
  <text x="560" y="472" class="m" text-anchor="middle">records.py</text>
  <text x="560" y="486" class="lb" text-anchor="middle">typed records, ClientData bundle</text>
  <text x="560" y="504" class="m" text-anchor="middle">facts.py</text>
  <text x="560" y="518" class="lb" text-anchor="middle">FACTS registry: name → data type</text>
  <text x="560" y="536" class="m" text-anchor="middle">quality.py</text>
  <text x="560" y="550" class="lb" text-anchor="middle">DataQuality notes</text>

  <rect x="670" y="430" width="190" height="150" rx="8" fill="#fff" stroke="#6c8ebf"/>
  <text x="765" y="452" class="t" text-anchor="middle">data/repositories/</text>
  <text x="765" y="474" class="m" text-anchor="middle">profile.py</text>
  <text x="765" y="490" class="m" text-anchor="middle">accounts.py</text>
  <text x="765" y="506" class="m" text-anchor="middle">engagement.py</text>
  <text x="765" y="522" class="m" text-anchor="middle">advice.py</text>
  <text x="765" y="544" class="lb" text-anchor="middle">+ rulesets.py · PyMongo async</text>
  <text x="765" y="558" class="lb" text-anchor="middle">documents.py · db.py · indexes.py</text>

  <path d="M355,408 V428" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M560,408 V428" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M765,408 V428" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- schemas / errors -->
  <rect x="260" y="598" width="600" height="52" rx="8" fill="#fff" stroke="#6c8ebf"/>
  <text x="560" y="619" class="t" text-anchor="middle">api/schemas.py + api/errors.py</text>
  <text x="560" y="637" class="s" text-anchor="middle">SegmentQuery · SegmentResponse · FamilyResult · DataQualityNote · error envelope</text>

  <!-- lifespan -->
  <rect x="260" y="664" width="600" height="52" rx="8" fill="#fff" stroke="#999" stroke-dasharray="5 4"/>
  <text x="560" y="685" class="t" text-anchor="middle">lifespan</text>
  <text x="560" y="703" class="s" text-anchor="middle">startup: Mongo client, ensure indexes + validators, load rule-set registry  ·  shutdown: close client</text>

  <!-- config + openapi -->
  <rect x="920" y="108" width="250" height="90" rx="8" fill="#f5f5f5" stroke="#666"/>
  <text x="1045" y="132" class="t" text-anchor="middle">config.py (pydantic-settings)</text>
  <text x="1045" y="152" class="m" text-anchor="middle">MONGODB_URI · MONGODB_DB</text>
  <text x="1045" y="168" class="m" text-anchor="middle">AS_OF_DATE</text>
  <text x="1045" y="184" class="m" text-anchor="middle">ACTIVE_RULESET_TTL</text>
  <path d="M920,153 H896 V300 H862" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <rect x="920" y="228" width="250" height="62" rx="8" fill="#f5f5f5" stroke="#666"/>
  <text x="1045" y="253" class="t" text-anchor="middle">/openapi.json</text>
  <text x="1045" y="272" class="s" text-anchor="middle">consumers generate typed clients</text>

  <!-- MongoDB -->
  <path d="M920,450 a125,20 0 0,0 250,0 a125,20 0 0,0 -250,0 v200 a125,20 0 0,0 250,0 v-200" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="1045" y="498" class="h" text-anchor="middle">MongoDB 7</text>
  <text x="1045" y="518" class="lb" text-anchor="middle">replica set · Decimal128 ↔ Decimal</text>
  <text x="1045" y="542" class="m" text-anchor="middle">clients · accounts</text>
  <text x="1045" y="558" class="m" text-anchor="middle">engagement · advice</text>
  <text x="1045" y="574" class="m" text-anchor="middle">rulesets · settings</text>
  <text x="1045" y="590" class="m" text-anchor="middle">ingestion_runs/_issues</text>
  <text x="1045" y="612" class="lb" text-anchor="middle">future: segment_results</text>
  <path d="M860,505 H918" stroke="#9673a6" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Ingest -->
  <rect x="240" y="770" width="200" height="60" rx="8" fill="#f5f5f5" stroke="#999"/>
  <text x="340" y="797" class="m" text-anchor="middle">data/*.json</text>
  <text x="340" y="813" class="lb" text-anchor="middle">synthetic, read-only</text>
  <path d="M440,800 H498" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="500" y="770" width="360" height="60" rx="8" fill="#fff" stroke="#9673a6"/>
  <text x="680" y="794" class="t" text-anchor="middle">ingest/ (one-shot container)</text>
  <text x="680" y="813" class="s" text-anchor="middle">validate → staging collections → atomic swap · seed rule sets</text>
  <path d="M860,800 H1045 V672" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <!-- arrows drawn last so heads sit above boxes -->
  <path d="M190,125 H258" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M258,150 H192" stroke="#4d8a42" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrg)"/>
  <path d="M210,500 H258" stroke="#d6b656" stroke-width="1.6" marker-end="url(#arr)"/>
</svg>
